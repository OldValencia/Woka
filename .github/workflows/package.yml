name: Package Woka

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            gradle-task: :desktopApp:packageMsi
            artifact-name: Woka-Windows-MSI
            artifact-path: desktopApp/build/compose/binaries/main/msi/*.msi

          - os: macos-latest
            os-name: macOS
            gradle-task: :desktopApp:packageDmg
            artifact-name: Woka-macOS-DMG
            artifact-path: desktopApp/build/compose/binaries/main/dmg/*.dmg

          - os: ubuntu-latest
            os-name: Linux
            gradle-task: :desktopApp:packageDeb
            artifact-name: Woka-Linux-DEB
            artifact-path: desktopApp/build/compose/binaries/main/deb/*.deb

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg dpkg-dev

      # libjxl and jxrlib ship inside the app (desktopApp/appResources/<os>-<arch>/). The Windows
      # set is committed; macOS and Linux build theirs from pinned sources before packaging.
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cmake ninja-build patchelf

      - name: Build bundled natives (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          bash natives/jxl/build.sh
          sh natives/jxr/build.sh

      - name: Build native installer
        run: ./gradlew ${{ matrix.gradle-task }}

      - name: Print jpackage error log on failure
        if: failure() && runner.os != 'Windows'
        run: |
          find desktopApp/build/compose/logs/ -name "jpackage-*-err.txt" -exec cat {} + || true

      - name: Upload ${{ matrix.os-name }} installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  bundle:
    name: Bundle All Installers
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: all-installers
          merge-multiple: true

      - name: Upload all installers bundle
        uses: actions/upload-artifact@v4
        with:
          name: Woka-All-Installers
          path: all-installers/*
