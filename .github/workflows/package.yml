name: Package Woka

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows only, and only the GraalVM native image (ST-005, the 1.0.8 product). The JVM build is
# deprecated, and the macOS and Linux installers it produced were never verified — the author
# turned them off on 2026-11-21 rather than ship them untested.
jobs:
  package:
    name: Package (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Oracle GraalVM (GraalVM Free Terms and Conditions: redistributed free of charge, which
      # Woka is). It sets GRAALVM_HOME, which the native image build reads; Visual Studio's C++
      # tools are preinstalled on the runner and found through vswhere.
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Windows set of libjxl and jxrlib is committed in desktopApp/appResources/windows-x64;
      # the Dolby Vision bridge is built here.
      - name: Build Dolby Vision metadata bridge
        shell: powershell
        run: ./natives/dovi/build.ps1

      # bash, not PowerShell: PowerShell splits `-Pwoka.native=true` at the dot. The builder's
      # heap is capped below the runner's 16 GB so the linker has room.
      - name: Build the native MSI
        shell: bash
        run: ./gradlew :desktopApp:packageMsi -Pwoka.native=true -Pwoka.native.builderMemory=12g

      - name: Print native-image log on failure
        if: failure()
        shell: bash
        run: tail -n 60 desktopApp/build/native-image/work/build.log || true

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Woka-Windows-MSI
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
